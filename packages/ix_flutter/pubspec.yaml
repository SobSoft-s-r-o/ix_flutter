name: ix_flutter
description: "Flutter UI library implementing the Siemens iX Design System: themes, tokens, widgets and an optional generator for the full iX icon catalogue."
version: 1.0.2
homepage: https://github.com/SobSoft-s-r-o/ix_flutter
repository: https://github.com/SobSoft-s-r-o/ix_flutter
issue_tracker: https://github.com/SobSoft-s-r-o/ix_flutter/issues
documentation: https://github.com/SobSoft-s-r-o/ix_flutter/tree/main/doc

screenshots:
  - description: 'Theme configuration and token overview with the bundled Work Sans typography (classic light)'
    path: screenshots/overview_light.png
  - description: 'Theme configuration and token overview with the bundled Work Sans typography (classic dark)'
    path: screenshots/overview_dark.png
  - description: 'Buttons: variants and states, Work Sans typography (classic light)'
    path: screenshots/components_light.png
  - description: 'Buttons: variants and states, Work Sans typography (classic dark)'
    path: screenshots/components_dark.png

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ">=3.10.0 <4.0.0"
  # SemanticsRole.* and SemanticsService.sendAnnouncement need Flutter 3.38.
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.3 # direct dependency: renders bundled internal iX icons (lib/src/ix_icons)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3 # direct dev dependency: test/toast/ix_toast_service_test.dart drives timers deterministically
  clock: ^1.1.2 # direct dev dependency: tests assign IxToastService.now = clock.now inside fakeAsync() for deterministic pause/resume timing

topics:
  - flutter
  - ui-kit
  - widgets
  - design-system
  - icons

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrains_Mono/static/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrains_Mono/static/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrains_Mono/static/JetBrainsMono-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/JetBrains_Mono/static/JetBrainsMono-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Roboto Mono
      fonts:
        - asset: assets/fonts/Roboto_Mono/static/RobotoMono-Thin.ttf
          weight: 100
        - asset: assets/fonts/Roboto_Mono/static/RobotoMono-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Roboto_Mono/static/RobotoMono-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Roboto_Mono/static/RobotoMono-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Roboto_Mono/static/RobotoMono-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto_Mono/static/RobotoMono-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Roboto_Mono/static/RobotoMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto_Mono/static/RobotoMono-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Roboto_Mono/static/RobotoMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto_Mono/static/RobotoMono-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Roboto_Mono/static/RobotoMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto_Mono/static/RobotoMono-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Roboto_Mono/static/RobotoMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto_Mono/static/RobotoMono-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Work Sans
      fonts:
        - asset: assets/fonts/Work_Sans/static/WorkSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/Work_Sans/static/WorkSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/Work_Sans/static/WorkSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Work_Sans/static/WorkSans-BoldItalic.ttf
          weight: 700
          style: italic
