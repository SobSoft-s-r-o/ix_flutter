name: Version Bump (Manual)

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to finalize
        required: true
        default: ix_flutter
        type: choice
        options: [ix_flutter, ix_icons_generator, both]
      bump:
        description: Semver bump, or none when pubspec already has the release version
        required: true
        default: patch
        type: choice
        options: [none, patch, minor, major]
      preid:
        description: Optional prerelease identifier (e.g., rc1)
        required: false
        default: ""
        type: string

env:
  FLUTTER_VERSION: 3.44.6
  FLUTTER_CHANNEL: stable
  CIDER_VERSION: 0.2.10
  PUB_CACHE: ~/.pub-cache

jobs:
  bump:
    name: Finalize release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # No `dart-lang/setup-dart` here: `subosito/flutter-action` above puts
      # the Flutter SDK's own `dart` on PATH, which runs `dart pub get`,
      # `dart pub global activate cider` and cider itself.

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-all-${{ hashFiles('packages/*/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-all-

      - name: Install ix_flutter dependencies
        if: inputs.package == 'ix_flutter' || inputs.package == 'both'
        working-directory: packages/ix_flutter
        run: flutter pub get

      - name: Install ix_icons_generator dependencies
        if: inputs.package == 'ix_icons_generator' || inputs.package == 'both'
        working-directory: packages/ix_icons_generator
        run: dart pub get

      - name: Analyze ix_flutter
        if: inputs.package == 'ix_flutter' || inputs.package == 'both'
        working-directory: packages/ix_flutter
        run: flutter analyze

      - name: Analyze ix_icons_generator
        if: inputs.package == 'ix_icons_generator' || inputs.package == 'both'
        working-directory: packages/ix_icons_generator
        run: dart analyze

      - name: Test ix_icons_generator
        if: inputs.package == 'ix_icons_generator' || inputs.package == 'both'
        working-directory: packages/ix_icons_generator
        run: dart test

      - name: Test ix_flutter
        if: inputs.package == 'ix_flutter' || inputs.package == 'both'
        working-directory: packages/ix_flutter
        run: flutter test

      - name: Activate cider
        run: dart pub global activate cider "$CIDER_VERSION"

      - name: Finalize ix_flutter release
        if: inputs.package == 'ix_flutter' || inputs.package == 'both'
        working-directory: packages/ix_flutter
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_PREID: ${{ inputs.preid }}
        run: |
          if [ "$RELEASE_BUMP" = "none" ] && [ -n "$RELEASE_PREID" ]; then
            echo "::error::preid cannot be used when bump is none"
            exit 1
          fi
          if [ "$RELEASE_BUMP" != "none" ]; then
            if [ -n "$RELEASE_PREID" ]; then
              dart pub global run cider bump "$RELEASE_BUMP" --pre="$RELEASE_PREID"
            else
              dart pub global run cider bump "$RELEASE_BUMP"
            fi
          fi
          dart pub global run cider release

      - name: Finalize ix_icons_generator release
        if: inputs.package == 'ix_icons_generator' || inputs.package == 'both'
        working-directory: packages/ix_icons_generator
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_PREID: ${{ inputs.preid }}
        run: |
          if [ "$RELEASE_BUMP" = "none" ] && [ -n "$RELEASE_PREID" ]; then
            echo "::error::preid cannot be used when bump is none"
            exit 1
          fi
          if [ "$RELEASE_BUMP" != "none" ]; then
            if [ -n "$RELEASE_PREID" ]; then
              dart pub global run cider bump "$RELEASE_BUMP" --pre="$RELEASE_PREID"
            else
              dart pub global run cider bump "$RELEASE_BUMP"
            fi
          fi
          dart pub global run cider release

      - name: Capture ix_flutter version
        if: inputs.package == 'ix_flutter' || inputs.package == 'both'
        id: ix_flutter_version
        run: |
          VERSION=$(grep '^version:' packages/ix_flutter/pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Capture ix_icons_generator version
        if: inputs.package == 'ix_icons_generator' || inputs.package == 'both'
        id: ix_icons_generator_version
        run: |
          VERSION=$(grep '^version:' packages/ix_icons_generator/pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        # Repository Actions settings must allow GitHub Actions to create pull
        # requests. A GITHUB_TOKEN-created PR can also require explicit
        # approval before its workflows run; see CONTRIBUTING.md.
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/release-${{ inputs.package }}-${{ steps.ix_flutter_version.outputs.version || steps.ix_icons_generator_version.outputs.version }}
          title: "chore: release ${{ inputs.package }} ${{ steps.ix_flutter_version.outputs.version || steps.ix_icons_generator_version.outputs.version }}"
          commit-message: "chore: prepare ${{ inputs.package }} ${{ steps.ix_flutter_version.outputs.version || steps.ix_icons_generator_version.outputs.version }}"
          body: |
            Automated release finalization.
            - package: ${{ inputs.package }}
            - bump: ${{ inputs.bump }}
            - preid: ${{ inputs.preid }}

            **ix_flutter**: ${{ steps.ix_flutter_version.outputs.version || 'not bumped' }}
            **ix_icons_generator**: ${{ steps.ix_icons_generator_version.outputs.version || 'not bumped' }}
          add-paths: |
            packages/ix_flutter/pubspec.yaml
            packages/ix_flutter/CHANGELOG.md
            packages/ix_icons_generator/pubspec.yaml
            packages/ix_icons_generator/CHANGELOG.md
          labels: release
