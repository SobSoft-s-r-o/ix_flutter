name: Wiki sync
on:
  push:
    branches: [main]
    # Every sync source in tool/wiki_sync_map.txt must be covered here, or a
    # change to it never reaches the wiki. `doc/**` covers doc/wiki/ too.
    paths:
      - 'doc/**'
      - '*.md'
      - 'packages/ix_flutter/*.md'
      - 'packages/ix_icons_generator/*.md'
      - 'tool/wiki_sync*'
  workflow_dispatch:
    inputs:
      dry_run: { description: 'Print actions only', type: boolean, default: true }
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Show dry-run plan
        if: env.DRY_RUN == 'true'
        run: tool/wiki_sync.sh --dry-run "$RUNNER_TEMP/wiki-dry-run"

      - name: Clone, sync and push wiki
        if: env.DRY_RUN != 'true'
        env:
          WIKI_SYNC_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
        run: |
          if [ -z "$WIKI_SYNC_TOKEN" ]; then
            echo "::error::WIKI_SYNC_TOKEN is required for a real wiki sync. Configure the repository secret or run the documented authenticated local Git sync."
            exit 1
          fi

          askpass="$RUNNER_TEMP/wiki-git-askpass.sh"
          {
            echo '#!/bin/sh'
            echo 'case "$1" in'
            echo '  *Username*) printf "%s\n" "x-access-token" ;;'
            echo '  *) printf "%s\n" "$WIKI_SYNC_TOKEN" ;;'
            echo 'esac'
          } > "$askpass"
          chmod 700 "$askpass"

          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          git clone "https://github.com/SobSoft-s-r-o/ix_flutter.wiki.git" wiki-checkout
          tool/wiki_sync.sh wiki-checkout

          git -C wiki-checkout config user.name "github-actions[bot]"
          git -C wiki-checkout config user.email "github-actions[bot]@users.noreply.github.com"
          git -C wiki-checkout add -A
          if git -C wiki-checkout diff --cached --quiet; then
            echo "No wiki pages changed; the remote wiki is already up to date."
            exit 0
          fi
          git -C wiki-checkout commit -m "docs: sync from ix_flutter@${{ github.sha }}"
          git -C wiki-checkout push
